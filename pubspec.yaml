name: focus_voca
description: "포커스 스타일의 중·고등학생용 오프라인 단어장 MVP"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  sqflite: ^2.4.2+1
  path: ^1.9.1
  crypto: ^3.0.6
  archive: ^4.0.7
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/starter_vocabulary.json
    - assets/content/catalog.json
    - assets/content/content.sqlite
    - assets/content/audio_bundle/
